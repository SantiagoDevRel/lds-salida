<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Del Sur — Linterna</title>
  <style>
    :root { --verde: #2bff7f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #fff; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 22px; gap: 14px;
    }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #888; }
    h1 { font-size: clamp(40px, 12vw, 72px); color: var(--verde); text-transform: uppercase; letter-spacing: -0.01em; line-height: 0.95; }
    p { color: #bbb; font-size: 15px; max-width: 360px; }
    a { display: inline-block; margin-top: 18px; color: var(--verde); border: 1px solid var(--verde); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; }
    a:hover { background: rgba(43,255,127,0.1); }
  </style>
</head>
<body>
  <div class="eyebrow">Desde 1997 · Siempre presentes</div>
  <h1>Los Del Sur</h1>
  <p>La linterna verde y blanca para la salida en tribuna. App nativa, 100% offline.</p>
  <a href="/privacy">Política de Privacidad</a>
</body>
</html>
